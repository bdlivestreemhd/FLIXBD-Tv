    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #111;
            color: white;
        }

        header {
            padding: 1rem;
            background-color: #1e1e1e;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            padding: 1rem;
        }

        .search-bar input {
            width: 80%;
            padding: 0.5rem;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
        }

        .player-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-color: #111;
            margin-top: 1rem;
        }

        #videoPlayer {
            width: 100%;
            max-width: 720px;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
        }

        .channels-wrapper {
            display: flex;
            overflow-x: auto;
            padding: 1rem;
            scroll-behavior: smooth;
            margin-top: 10px;
            justify-content: flex-start;
            direction: rtl;
        }

        .channel {
            text-align: center;
            background: #1c1c1c;
            padding: 0.5rem;
            border-radius: 8px;
            transition: transform 0.2s;
            display: inline-block;
            margin-left: 0.5rem;
            cursor: pointer;
            width: 60px;
            flex-shrink: 0;
        }

        .channel:hover {
            transform: scale(1.05);
        }

        .channel-logo {
            width: 100%;
            height: auto;
            border-radius: 50%;
        }

        .channel-name {
            margin-top: 0.3rem;
            font-size: 0.65rem;
        }

        footer {
            background: #1e1e1e;
            padding: 1rem;
            text-align: center;
        }

        .active-users {
            font-size: 0.9rem;
            color: #ccc;
        }

        .marquee {
            background: #222;
            color: #00ff99;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
        }

        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-left 15s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>

    <script>
        const videoPlayer = videojs('videoPlayer', {
            techOrder: ['html5'],
            controls: true,
            preload: 'auto',
        });

        document.querySelectorAll('.channel').forEach(channel => {
            channel.addEventListener('click', function () {
                const streamUrl = channel.getAttribute('data-stream');
                videoPlayer.src({
                    src: streamUrl,
                    type: 'application/x-mpegURL'
                });
                videoPlayer.play();
            });
        });

        document.getElementById('searchInput').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('.channel').forEach(channel => {
                const name = channel.querySelector('.channel-name').textContent.toLowerCase();
                channel.style.display = name.includes(query) ? '' : 'none';
            });
        });
    </script>
